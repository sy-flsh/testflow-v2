openapi: 3.1.0
info:
  title: TMS API (Test Management System)
  version: 0.1.0
  description: |
    TMS(Test Management System) HTTP API 계약 정본 (P1 초안).

    본 문서는 backend-standard `GET/POST 전용 룰`(§4.2)을 따른다. 상태 변경은 모두 `POST`로 표현하며
    URL 패턴은 `POST /resources` (생성) · `POST /resources/{id}` (수정) · `POST /resources/{id}/{action}` (액션)을 사용한다.

    공통 응답은 `ApiResponse<T>` 단일 래퍼이며 (success/code/message/data + 에러 진단 필드 traceId/timestamp/path/errors)
    페이지네이션 응답은 `PagedResponse<T>` (content/totalElements/totalPages/currentPage/size).

    인증은 JWT Bearer (`Authorization: Bearer <AccessToken>`, SRS §6.2). 인가는 (User × Scope) 다중 Role
    매트릭스(`docs/permissions.md`)에 따른다. 모든 작성/삭제/액션 엔드포인트는 backend-standard `ErrorCode`
    문자열 의미 코드(`{DOMAIN}_{상황}`)와 정합한다.

    도메인 락 정합(features/README v2.3): 3-tier 격리(Company → Workspace → Project), Role 6단,
    회원가입 2경로 + 초대, Project `code` 불변, TestCase Scope 3종, TestRun 단계별 실행 + 자동 종료 + duration,
    TC 변경 시 영향 Run UNTESTED + 이력, 삭제 작성자 한정(★16).
  contact:
    name: TMS PM
    email: pm@unione.example
  license:
    name: Proprietary
servers:
  - url: https://api.tms.dev.unione.example/api/v1
    description: dev (개발)
  - url: https://api.tms.stg.unione.example/api/v1
    description: staging
  - url: https://api.tms.unione.example/api/v1
    description: production
tags:
  - name: F-COMPANY
    description: 회사(Company) 관리 — Master·CO. 테넌트 격리 루트
  - name: F-WS
    description: 워크스페이스(Workspace) 관리 — WO 생성·CO 비활성·소유자 이관·멤버 초대
  - name: F-AUTH
    description: 인증(로그인·회원가입 2경로·초대 수락·이메일 인증·비번 리셋·토큰 갱신)
  - name: F-USER
    description: Company 사용자 관리 + Scope×Role 매트릭스 부여 (CO 전용 매트릭스)
  - name: F-PROJ
    description: 프로젝트(Project) 관리 — code 불변·멤버 초대
  - name: F-TS
    description: 테스트 스위트(TestSuite) 트리 — 폴더 구조
  - name: F-TC
    description: 테스트 케이스(TestCase) — Scope 3종(Global/Workspace/Project) + steps + tags
  - name: F-PLAN
    description: 테스트 계획(TestPlan) — PlanItem 묶기·담당자 할당·상태 전이
  - name: F-RUN
    description: 테스트 실행(TestRun) — 단계별 결과 + 자동 종료 + duration + 이력
  - name: F-DEF
    description: 결함(Defect) — 상태 4종 DAG + 담당자 + Run 연결
  - name: F-ATTACH
    description: 첨부(Attachment) — TestRun/Defect 종속, 로컬 디스크, 10MB 상한
  - name: F-REPORT
    description: 최소 리포트 — Plan별 Pass율 + 결함 상태 카운트
paths:
  # ============================================================================
  # F-AUTH (인증) — 공개 + 인증 엔드포인트
  # ============================================================================
  /auth/login:
    post:
      tags: [F-AUTH]
      operationId: login
      summary: 로그인 (Master/Company User 통합)
      description: |
        이메일·비밀번호로 로그인하고 Access(30분)/Refresh(30일) 토큰을 발급한다.
        `master_admins`를 우선 매칭하고, 미일치 시 `users.email`로 검색한다. 비활성 Company/User,
        이메일 미인증 셀프 가입자는 차단된다. (Required Role: 미인증)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [F-AUTH]
      operationId: refreshToken
      summary: Refresh Token 회전·Access 갱신
      description: Refresh 회전(rotate) 정책. 신규 Refresh도 발급되며 기존 토큰은 즉시 폐기. (Required Role: 미인증, Refresh Token 보유자)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: 갱신 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/TokenPairResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [F-AUTH]
      operationId: logout
      summary: 로그아웃 (Refresh Token 폐기)
      description: 인증된 사용자가 본인의 Refresh Token을 폐기한다. Access는 자연 만료. (Required Role: 인증된 모든 사용자)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/signup-co:
    post:
      tags: [F-AUTH]
      operationId: signupCompanyOwner
      summary: 셀프 회원가입 (경로 B — CO + 신규 Company 자동 생성)
      description: |
        email·password·name·companyName 입력으로 신규 Company(`is_active=false`)와 첫 CO 사용자를 생성한다.
        이메일 인증 완료 시 Company 활성화. (Required Role: 미인증)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupCompanyOwnerRequest' }
      responses:
        '200':
          description: 가입 접수 (인증 메일 발송)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/verify-email:
    post:
      tags: [F-AUTH]
      operationId: verifyEmail
      summary: 이메일 인증 토큰 확정
      description: 셀프 가입 인증 메일 토큰을 검증·소비하고 사용자/Company를 활성화. (Required Role: 미인증)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: 인증 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/accept-invite:
    post:
      tags: [F-AUTH]
      operationId: acceptInvite
      summary: 초대 수락 (경로 C — 비번 설정 + 자동 로그인)
      description: |
        초대 토큰을 검증·소비하고 사용자를 가입 처리한다(`is_email_verified=true` 자동). 초대 발급 시
        Scope×Role이 사전 지정되었으면 자동 부여. (Required Role: 미인증)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: 수락 완료 (Access/Refresh 발급)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/forgot-password:
    post:
      tags: [F-AUTH]
      operationId: forgotPassword
      summary: 비밀번호 리셋 요청 (이메일 발송)
      description: 존재 은닉. email 존재 여부와 무관하게 항상 200. 존재 시 토큰 생성·메일 발송. Rate Limit 5분당 3회. (Required Role: 미인증)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: 동일 안내 응답
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/reset-password:
    post:
      tags: [F-AUTH]
      operationId: resetPassword
      summary: 비밀번호 리셋 확정 (토큰 + 새 비번)
      description: 리셋 토큰을 검증·소비하고 비밀번호를 BCrypt로 갱신. 모든 Refresh Token 폐기. (Required Role: 미인증)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: 비번 재설정 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/change-password:
    post:
      tags: [F-AUTH]
      operationId: changePassword
      summary: 본인 비밀번호 변경 (인증)
      description: 현재 비번·새 비번 입력. mustChangePassword 플래그 해제. 타 세션 Refresh 일괄 폐기. (Required Role: 인증된 모든 사용자)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================================
  # F-COMPANY (회사 관리)
  # ============================================================================
  /master/companies:
    get:
      tags: [F-COMPANY]
      operationId: listCompaniesForMaster
      summary: 전역 Company 목록 (Master)
      description: Master 전용. 전체 Company 페이지네이션. (Required Role: Master)
      parameters:
        - $ref: '#/components/parameters/qQuery'
        - $ref: '#/components/parameters/isActiveQuery'
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/sizeQuery'
        - $ref: '#/components/parameters/sortQuery'
      responses:
        '200':
          description: 회사 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PagedResponse'
                          - properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/CompanyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [F-COMPANY]
      operationId: createCompanyByMaster
      summary: Master 등록 경로 — 신규 Company + 첫 CO 생성
      description: Master가 회사명·slug·첫 CO 이메일·이름으로 회사를 생성. 임시비번 메일 발송. (Required Role: Master)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompanyRequest' }
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CreatedCompanyResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /master/companies/{companyId}:
    get:
      tags: [F-COMPANY]
      operationId: getCompanyForMaster
      summary: Company 상세 (Master)
      description: Master 전용 상세 조회. (Required Role: Master)
      parameters:
        - $ref: '#/components/parameters/companyIdPath'
      responses:
        '200':
          description: 회사 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CompanyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /master/companies/{companyId}/activate:
    post:
      tags: [F-COMPANY]
      operationId: activateCompany
      summary: Company 활성화 (Master)
      description: Master가 Company를 활성화. (Required Role: Master)
      parameters:
        - $ref: '#/components/parameters/companyIdPath'
      responses:
        '200':
          description: 활성화 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /master/companies/{companyId}/deactivate:
    post:
      tags: [F-COMPANY]
      operationId: deactivateCompany
      summary: Company 비활성화 (Master)
      description: Master가 Company를 비활성화. 하위 사용자 로그인은 403 `COMPANY_INACTIVE`로 차단된다. (Required Role: Master)
      parameters:
        - $ref: '#/components/parameters/companyIdPath'
      responses:
        '200':
          description: 비활성화 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /company:
    get:
      tags: [F-COMPANY]
      operationId: getMyCompany
      summary: 본인 Company 조회 (모든 인증 사용자)
      description: 인증된 사용자가 본인 Company의 공개 필드 또는 CO/Master는 확장 필드를 조회. (Required Role: 인증된 모든 사용자)
      responses:
        '200':
          description: 본인 Company
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CompanyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /company/update:
    post:
      tags: [F-COMPANY]
      operationId: updateCompany
      summary: 본인 Company 정보 수정 (CO)
      description: 이름·연락처(확장 필드) 부분 변경. **slug 불변**. (Required Role: CO)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCompanyRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CompanyResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /company/transfer-ownership:
    post:
      tags: [F-COMPANY]
      operationId: transferCompanyOwnership
      summary: Company 소유자 이관 (CO → 다른 CO)
      description: 대상은 현재 CO 보유자만. 본인 CO 권한은 별도 회수 절차 필요. (Required Role: CO)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOwnershipRequest' }
      responses:
        '200':
          description: 이관 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /company/users/{userId}/grant-co:
    post:
      tags: [F-COMPANY]
      operationId: grantCompanyOwnerRole
      summary: 사용자 CO 권한 부여 (CO)
      description: 대상 사용자에게 (COMPANY, companyId, CO) 행을 추가. 중복 시 무시. (Required Role: CO)
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      responses:
        '200':
          description: 부여 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================================
  # F-WS (워크스페이스)
  # ============================================================================
  /workspaces:
    get:
      tags: [F-WS]
      operationId: listWorkspaces
      summary: Workspace 목록 조회
      description: |
        Role 기반 가시 필터. CO는 Company 내 전체. 그 외 Role은 본인이 멤버인 WS만 노출.
        (Required Role: 인증된 모든 사용자)
      parameters:
        - $ref: '#/components/parameters/qQuery'
        - $ref: '#/components/parameters/isActiveQuery'
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/Role' } }
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/sizeQuery'
        - $ref: '#/components/parameters/sortQuery'
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PagedResponse'
                          - properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/WorkspaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [F-WS]
      operationId: createWorkspace
      summary: Workspace 생성 (WO)
      description: 무제한 생성. 요청자는 자동 owner_user_id 등록 + (WORKSPACE, wsId, WO) 행 추가. (Required Role: WO)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
