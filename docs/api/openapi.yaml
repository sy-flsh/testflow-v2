                                items: { $ref: '#/components/schemas/TestRunResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================================
  # F-DEF (결함)
  # ============================================================================
  /projects/{projectId}/defects:
    get:
      tags: [F-DEF]
      operationId: listDefects
      summary: Defect 목록·검색
      description: (Required Role: Project 멤버)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - $ref: '#/components/parameters/qQuery'
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/DefectStatus' } }
        - { name: severity, in: query, required: false, schema: { $ref: '#/components/schemas/Severity' } }
        - { name: priority, in: query, required: false, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: reporterUserId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: assigneeUserId, in: query, required: false, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/sizeQuery'
        - $ref: '#/components/parameters/sortQuery'
      responses:
        '200':
          description: Defect 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PagedResponse'
                          - properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/DefectListItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [F-DEF]
      operationId: createDefect
      summary: Defect 등록 (PO·Member)
      description: |
        testRunId(선택, 같은 Project)·title·severity·priority·reproductionSteps·assigneeUserId(선택, PO만) 입력.
        상태 자동 OPEN. code 자동 `DEF-<project.code>-<seq>`. (Required Role: PO 또는 Member)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDefectRequest' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/DefectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{projectId}/defects/{defectId}:
    get:
      tags: [F-DEF]
      operationId: getDefect
      summary: Defect 상세
      description: (Required Role: Project 멤버)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - $ref: '#/components/parameters/defectIdPath'
      responses:
        '200':
          description: Defect 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/DefectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{projectId}/defects/{defectId}/update:
    post:
      tags: [F-DEF]
      operationId: updateDefect
      summary: Defect 수정
      description: |
        PO는 모든 필드. Member는 본인 reporter/assignee 때만(★11) 본문 필드 수정.
        담당자 변경은 별도 /assign. (Required Role: PO 또는 본인 reporter/assignee Member)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - $ref: '#/components/parameters/defectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDefectRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/DefectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{projectId}/defects/{defectId}/delete:
    post:
      tags: [F-DEF]
      operationId: deleteDefect
      summary: Defect soft 삭제 (작성자 한정 ★16)
      description: reporter=요청자(=`created_by`)만. PO/CO 우회 X. (Required Role: 작성자)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - $ref: '#/components/parameters/defectIdPath'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{projectId}/defects/{defectId}/status:
    post:
      tags: [F-DEF]
      operationId: transitionDefectStatus
      summary: Defect 상태 전이
      description: |
        DAG: OPEN→IN_PROGRESS→RESOLVED→CLOSED, RESOLVED→OPEN(재오픈). 그 외 거부.
        Member는 본인 reporter/assignee만(★11). (Required Role: PO 또는 본인 reporter/assignee Member)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - $ref: '#/components/parameters/defectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionDefectStatusRequest' }
      responses:
        '200':
          description: 전이 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/DefectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{projectId}/defects/{defectId}/assign:
    post:
      tags: [F-DEF]
      operationId: assignDefect
      summary: Defect 담당자 지정/변경 (PO)
      description: 같은 Project 멤버. 미할당은 assigneeUserId=null. (Required Role: PO)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - $ref: '#/components/parameters/defectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignDefectRequest' }
      responses:
        '200':
          description: 할당 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/DefectResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================================
  # F-ATTACH (첨부)
  # ============================================================================
  /projects/{projectId}/attachments:
    get:
      tags: [F-ATTACH]
      operationId: listAttachments
      summary: 첨부 목록 (owner 필터 필수)
      description: ownerType/ownerId 필수. (Required Role: Project 멤버)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - { name: ownerType, in: query, required: true, schema: { $ref: '#/components/schemas/AttachmentOwnerType' } }
        - { name: ownerId, in: query, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/sizeQuery'
      responses:
        '200':
          description: 첨부 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PagedResponse'
                          - properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/AttachmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [F-ATTACH]
      operationId: uploadAttachment
      summary: 첨부 업로드 (multipart, 단일 파일)
      description: |
        화이트리스트 확장자(png/jpg/jpeg/gif/webp/pdf/txt/log) + 10MB 이하. 로컬 디스크 저장.
        ownerType/ownerId는 같은 Project. (Required Role: PO 또는 Member)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadAttachmentRequest' }
      responses:
        '201':
          description: 업로드 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/AttachmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{projectId}/attachments/{attachmentId}/download:
    get:
      tags: [F-ATTACH]
      operationId: downloadAttachment
      summary: 첨부 다운로드 (스트림)
      description: Content-Disposition 원본명. (Required Role: Project 멤버 — Viewer 포함)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - $ref: '#/components/parameters/attachmentIdPath'
      responses:
        '200':
          description: 파일 스트림
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="<원본명>"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{projectId}/attachments/{attachmentId}/delete:
    post:
      tags: [F-ATTACH]
      operationId: deleteAttachment
      summary: 첨부 soft 삭제 (작성자 한정 ★16)
      description: 업로드자(=`created_by`)만. 24h 윈도·PO 우회 폐기. 메타만 soft, 파일은 보존. (Required Role: 업로드자)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - $ref: '#/components/parameters/attachmentIdPath'
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================================
  # F-REPORT (최소 리포트)
  # ============================================================================
  /projects/{projectId}/report:
    get:
      tags: [F-REPORT]
      operationId: getProjectReport
      summary: Project 리포트 (Plan별 Pass율 + Defect 상태 카운트 + totals)
      description: |
        진척률·통과율은 F-PLAN·F-RUN v2 정합(최신 Run 기준, IN_PROGRESS는 미실행). 결함은 is_deleted=false만.
        (Required Role: Project 멤버 — Viewer 포함)
      parameters:
        - $ref: '#/components/parameters/projectIdPath'
        - { name: planStatus, in: query, required: false, schema: { $ref: '#/components/schemas/TestPlanStatus' } }
        - { name: dateFrom, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 리포트
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/ProjectReportResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

# ============================================================================
# Components
# ============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer 토큰. 클레임: `userId`, `companyId`(Master는 null), `isMaster`(bool), `iat`, `exp`.
        Role은 미포함 — 매 요청 `user_roles` 조회로 인가 판정(SRS §6.2).

  parameters:
    companyIdPath:
      name: companyId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Company id
    workspaceIdPath:
      name: workspaceId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Workspace id
    projectIdPath:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Project id
    userIdPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: User id
    invitationIdPath:
      name: invitationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Invitation id
    suiteIdPath:
      name: suiteId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: TestSuite id
    testCaseIdPath:
      name: testCaseId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: TestCase id
    planIdPath:
      name: planId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: TestPlan id
    planItemIdPath:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: PlanItem id
    runIdPath:
      name: runId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: TestRun id
    runStepIdPath:
      name: stepId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: TestRunStep id (이 Run의 step만 허용)
    defectIdPath:
      name: defectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Defect id
    attachmentIdPath:
      name: attachmentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Attachment id
    idPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: 범용 식별자
    pageQuery:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
      description: 0-based 페이지 번호 (SRS §6.1)
    sizeQuery:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: 페이지 크기 (max 100)
    sortQuery:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: '`field,asc|desc` (예: `createdAt,desc`). 콤마로 다중 정렬 가능'
    qQuery:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: 부분일치 검색 키워드 (대상 필드는 기능별 명시)
    isActiveQuery:
      name: isActive
      in: query
      required: false
      schema: { type: boolean }
      description: 활성 상태 필터

  responses:
    Unauthorized:
      description: 401 — 미인증 또는 토큰 만료/무효
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 403 — 권한 없음 / 비활성 격리
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 404 — 리소스 없음 / 격리 위반 은닉
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: 400/422 — 입력 검증 실패 (필드별 errors[] 포함)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 409 — 상태 충돌 / 중복
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: 429 — Rate Limit 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: 500 — 서버 내부 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ----------------------------------------------------------------
    # 공통 응답 래퍼 / 페이지네이션 / 에러
    # ----------------------------------------------------------------
    ApiResponse:
      type: object
      description: 공통 응답 래퍼 (backend §4.5). 에러 시 진단 필드 traceId/timestamp/path/errors 추가.
      required: [success, code, message]
      properties:
        success: { type: boolean, example: true }
        code: { type: string, example: SUCCESS, description: '성공=SUCCESS, 에러=문자열 의미 코드(예: TESTCASE_NOT_FOUND)' }
        message: { type: string, example: 요청이 정상 처리되었습니다. }
        data: { description: 응답 페이로드 (성공 시), 에러는 null }

    PagedResponse:
      type: object
      description: 페이지네이션 응답
      required: [content, totalElements, totalPages, currentPage, size]
      properties:
        content:
          type: array
          items: { type: object }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        currentPage: { type: integer }
        size: { type: integer }

    ErrorResponse:
      type: object
      description: 표준 에러 응답 (ApiResponse + 진단 필드, backend §5.3)
      required: [success, code, message]
      properties:
        success: { type: boolean, example: false }
        code: { type: string, example: COMMON_INVALID_INPUT }
        message: { type: string }
        data:
          type: object
          nullable: true
        traceId: { type: string, example: b1f3c2a4-8e7d-4a11-9f0c-2d3e4f5a6b7c }
        timestamp: { type: string, format: date-time }
        path: { type: string, example: /api/v1/test-cases }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      properties:
        field: { type: string, example: title }
        reason: { type: string, example: 필수 항목입니다. }

    # ----------------------------------------------------------------
    # Enums (ERD §4)
    # ----------------------------------------------------------------
    Role:
      type: string
      description: |
        user_roles.role (5종). Master는 master_admins로 표현되어 user_roles 행이 없으므로
        본 enum에서 제외 (ERD §5 Role enum 정본, permissions §3 표).
      enum: [CO, WO, PO, MEMBER, VIEWER]

    Scope:
      type: string
      description: user_roles.scope_type / invitations.scope_type (ERD §5 ScopeType)
      enum: [COMPANY, WORKSPACE, PROJECT]

    Priority:
      type: string
      description: TC·Defect priority (ERD §5 + glossary §4.2, PascalCase 정본)
      enum: [Urgent, High, Medium, Low]

    Severity:
      type: string
      description: Defect severity (ERD §5 + glossary §4.1, PascalCase 정본)
      enum: [Critical, Major, Minor, Trivial]

    DefectStatus:
      type: string
      description: MVP 4종 (DAG OPEN→IN_PROGRESS→RESOLVED→CLOSED, RESOLVED→OPEN)
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]

    TestPlanStatus:
      type: string
      description: 단방향 전이 (DRAFT→IN_PROGRESS→CLOSED)
      enum: [DRAFT, IN_PROGRESS, CLOSED]

    TestRunStatus:
      type: string
      description: 자동 종료 enum (Rule 2)
      enum: [IN_PROGRESS, COMPLETED]

    ExecutionResult:
      type: string
      description: MVP 5종 (UNTESTED 활성, Retest는 Phase 2)
      enum: [UNTESTED, PASS, FAIL, BLOCKED, SKIPPED]

    TestCaseScope:
      type: string
      description: TC Scope 3종 (Rule 3, 불변)
      enum: [GLOBAL, WORKSPACE, PROJECT]

    TestCaseScopeFilter:
      type: string
      description: 목록 필터용 (`ALL` 합본 포함)
      enum: [GLOBAL, WORKSPACE, PROJECT, ALL]

    AttachmentOwnerType:
      type: string
      description: 첨부 owner_type
      enum: [TEST_RUN, DEFECT]

    TestRunStepHistoryReason:
      type: string
      description: TC 변경 이력 사유 (Rule 4·5)
      enum: [TC_UPDATED, TC_STEP_ADDED, TC_STEP_DELETED]

    # ----------------------------------------------------------------
    # 공통 요약 객체
    # ----------------------------------------------------------------
    UserSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }

    WorkspaceSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    ProjectSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string }

    TestCaseSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }

    # ----------------------------------------------------------------
    # F-COMPANY
    # ----------------------------------------------------------------
    CompanyResponse:
      type: object
      required: [id, name, slug, isActive]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string, description: 시스템 유일, 불변 }
        isActive: { type: boolean }
        ownerUser:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCompanyRequest:
      type: object
      required: [name, firstCoEmail, firstCoName]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug:
          type: string
          nullable: true
          description: 미전송 시 자동 생성 (kebab-case, 시스템 유일)
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 50
        firstCoEmail: { type: string, format: email }
        firstCoName: { type: string, minLength: 1, maxLength: 50 }

    CreatedCompanyResponse:
      type: object
      properties:
        company: { $ref: '#/components/schemas/CompanyResponse' }
        firstCoUser: { $ref: '#/components/schemas/UserSummary' }

    UpdateCompanyRequest:
      type: object
      description: 본인 Company 정보 부분 변경. slug는 포함 시 무시(불변).
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    TransferOwnershipRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId: { type: integer, format: int64 }

    # ----------------------------------------------------------------
    # F-WS
    # ----------------------------------------------------------------
    WorkspaceResponse:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        ownerUser:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
        memberCount: { type: integer }
        projectCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }

    WorkspaceMemberResponse:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        roles:
          type: array
          description: 이 WS Scope에서 보유한 Role 목록
          items: { $ref: '#/components/schemas/Role' }

    InviteWorkspaceMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }

    # ----------------------------------------------------------------
    # F-AUTH
    # ----------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        mustChangePassword: { type: boolean, default: false }
        user: { $ref: '#/components/schemas/AuthUserContext' }

    AuthUserContext:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        companyId:
          type: integer
          format: int64
          nullable: true
          description: Master는 null
        isMaster: { type: boolean }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenPairResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    SignupCompanyOwnerRequest:
      type: object
      required: [email, password, name, companyName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        name: { type: string, minLength: 1, maxLength: 50 }
        companyName: { type: string, minLength: 1, maxLength: 100 }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, format: password, minLength: 8 }
        name: { type: string, minLength: 1, maxLength: 50, nullable: true }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 8 }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }

    # ----------------------------------------------------------------
    # F-USER
    # ----------------------------------------------------------------
    UserListItemResponse:
      type: object
      required: [id, email, name, isActive]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        isActive: { type: boolean }
        isEmailVerified: { type: boolean }
        roleCount: { type: string, description: '예: CO·WO×2·M(W)×1·M(P)×3 (Scope suffix W=WORKSPACE, P=PROJECT 필수)' }
        createdAt: { type: string, format: date-time }

    UserDetailResponse:
      type: object
      required: [id, email, name, isActive]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        isActive: { type: boolean }
        isEmailVerified: { type: boolean }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        rolesByScope: { $ref: '#/components/schemas/RolesByScope' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RolesByScope:
      type: object
      description: 매트릭스 UI 직렬화 (Scope별 Role 목록)
      properties:
        COMPANY:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        WORKSPACE:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceRoleAssignment' }
        PROJECT:
          type: array
          items: { $ref: '#/components/schemas/ProjectRoleAssignment' }

    WorkspaceRoleAssignment:
      type: object
      properties:
        workspaceId: { type: integer, format: int64 }
        workspaceName: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    ProjectRoleAssignment:
      type: object
      properties:
        workspaceId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        projectName: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    RoleGrantSpec:
      type: object
      required: [scopeType, scopeId, role]
      properties:
        scopeType: { $ref: '#/components/schemas/Scope' }
        scopeId: { type: integer, format: int64 }
        role: { $ref: '#/components/schemas/Role' }

    SyncUserRolesRequest:
      type: object
      description: 단일 트랜잭션 + 멱등. grants/revokes 둘 중 1개 이상 필수.
      properties:
        grants:
          type: array
          items: { $ref: '#/components/schemas/RoleGrantSpec' }
        revokes:
          type: array
          items: { $ref: '#/components/schemas/RoleGrantSpec' }

    InvitationResponse:
      type: object
      required: [id, email, scopeType, scopeId, expiresAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        scopeType: { $ref: '#/components/schemas/Scope' }
        scopeId: { type: integer, format: int64 }
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          nullable: true
          description: 사전 부여 옵션 (없으면 가입 후 수동 부여)
        invitedByUser: { $ref: '#/components/schemas/UserSummary' }
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateInvitationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 50, nullable: true }
        preassignedRoles:
          type: array
          description: 가입 시 자동 매트릭스 부여
          items: { $ref: '#/components/schemas/RoleGrantSpec' }

    UpdateMyProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }

    # ----------------------------------------------------------------
    # F-PROJ
    # ----------------------------------------------------------------
    ProjectResponse:
      type: object
      required: [id, name, code, isActive]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code:
          type: string
          description: '`^[A-Z][A-Z0-9]{1,9}$`, Company 내 unique, 불변'
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        owner:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
          description: Member 생성 직후엔 null 가능
        workspace: { $ref: '#/components/schemas/WorkspaceSummary' }
        memberCount: { type: integer }
        testCaseCount: { type: integer }
        defectCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        code:
          type: string
          description: 'Company 내 unique, 불변'
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
          minLength: 2
          maxLength: 10
        description: { type: string, maxLength: 1000, nullable: true }

    UpdateProjectRequest:
      type: object
      description: '**code는 포함 금지** (불변). 포함 시 400 `PROJ_CODE_IMMUTABLE`'
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000, nullable: true }

    ProjectMemberResponse:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    InviteProjectMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }

    # ----------------------------------------------------------------
    # F-TS
    # ----------------------------------------------------------------
    TestSuiteResponse:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentSuiteId: { type: integer, format: int64, nullable: true }
        sortOrder: { type: integer }
        testCaseCount: { type: integer }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserSummary' }

    TestSuiteTreeNode:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentSuiteId: { type: integer, format: int64, nullable: true }
        sortOrder: { type: integer }
        testCaseCount: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/TestSuiteTreeNode' }

    CreateTestSuiteRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentSuiteId:
          type: integer
          format: int64
          nullable: true
          description: null=root

    UpdateTestSuiteRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    MoveTestSuiteRequest:
      type: object
      properties:
        newParentSuiteId:
          type: integer
          format: int64
          nullable: true
          description: null=root
        newSortOrder: { type: integer, minimum: 0, nullable: true }

    # ----------------------------------------------------------------
    # F-TC (TestCase + TestStep)
    # ----------------------------------------------------------------
    TestStepRequestItem:
      type: object
      required: [order, action]
      properties:
        order: { type: integer, minimum: 1 }
        action: { type: string }
        expectedResult: { type: string, nullable: true }

    TestStepResponseItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        order: { type: integer }
        action: { type: string }
        expectedResult: { type: string, nullable: true }

    TestCaseListItemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 'TC-<projCode>-<seq> / TC-WS<wsId>-<seq> / TC-GBL-<seq>' }
        scopeType: { $ref: '#/components/schemas/TestCaseScope' }
        scopeId: { type: integer, format: int64 }
        title: { type: string }
        suiteId: { type: integer, format: int64, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        tags:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }

    TestCaseResponse:
      type: object
      required: [id, code, scopeType, title, priority]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        scopeType: { $ref: '#/components/schemas/TestCaseScope' }
        scopeId: { type: integer, format: int64, description: 'Scope에 따라 companyId/workspaceId/projectId' }
        title: { type: string }
        suite:
          type: object
          nullable: true
          description: PROJECT Scope만 존재
          properties:
            id: { type: integer, format: int64 }
            path: { type: string, description: '루트→리프 폴더 경로 문자열' }
        priority: { $ref: '#/components/schemas/Priority' }
        precondition: { type: string, nullable: true }
        expectedResult: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/TestStepResponseItem' }
        createdBy: { $ref: '#/components/schemas/UserSummary' }
        updatedBy: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTestCaseBase:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        priority:
          allOf:
            - $ref: '#/components/schemas/Priority'
          default: Medium
        precondition: { type: string, maxLength: 2000, nullable: true }
        expectedResult: { type: string, maxLength: 2000, nullable: true }
        tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 30 }
        steps:
          type: array
          items: { $ref: '#/components/schemas/TestStepRequestItem' }

    CreateGlobalTestCaseRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTestCaseBase'
        - type: object
          description: 'scopeType=GLOBAL (서버 강제). suiteId 미전송.'

    CreateWorkspaceTestCaseRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTestCaseBase'
        - type: object
          description: 'scopeType=WORKSPACE (서버 강제, path workspaceId 사용). suiteId 미전송.'

    CreateProjectTestCaseRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTestCaseBase'
        - type: object
          required: [suiteId]
          description: 'scopeType=PROJECT (서버 강제, path projectId 사용). suiteId 필수.'
          properties:
            suiteId: { type: integer, format: int64 }

    UpdateTestCaseRequest:
      type: object
      description: |
        부분 변경. scopeType은 변경 불가(`TC_SCOPE_IMMUTABLE`).
        title/precondition/expectedResult/steps[] 중 1개 이상 변경 시 영향 TestRun이 비동기로
        step UNTESTED 재설정 + test_run_step_history 기록(Rule 4·5, F-RUN §5.7).
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        priority: { $ref: '#/components/schemas/Priority' }
        precondition: { type: string, maxLength: 2000, nullable: true }
        expectedResult: { type: string, maxLength: 2000, nullable: true }
        tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 30 }
        steps:
          type: array
          description: 전체 교체 모델 (부분 패치 Phase 2)
          items: { $ref: '#/components/schemas/TestStepRequestItem' }

    MoveTestCaseRequest:
      type: object
      required: [newSuiteId]
      properties:
        newSuiteId: { type: integer, format: int64 }

    # ----------------------------------------------------------------
    # F-PLAN
    # ----------------------------------------------------------------
    TestPlanResponse:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: '#/components/schemas/TestPlanStatus' }
        milestone: { type: string, nullable: true }
        plannedStartAt: { type: string, format: date-time, nullable: true }
        plannedEndAt: { type: string, format: date-time, nullable: true }
        itemCount: { type: integer }
        executedCount: { type: integer }
        passRate:
          type: number
          format: double
          nullable: true
          description: passCount/executedCount, executedCount=0 시 null
        createdBy: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TestPlanDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TestPlanResponse'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PlanItemResponse' }

    CreateTestPlanRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        milestone: { type: string, maxLength: 100, nullable: true }
        plannedStartAt: { type: string, format: date-time, nullable: true }
        plannedEndAt: { type: string, format: date-time, nullable: true }

    UpdateTestPlanRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        milestone: { type: string, maxLength: 100, nullable: true }
        plannedStartAt: { type: string, format: date-time, nullable: true }
        plannedEndAt: { type: string, format: date-time, nullable: true }

    TransitionTestPlanStatusRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus: { $ref: '#/components/schemas/TestPlanStatus' }

    PlanItemResponse:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        testCase: { $ref: '#/components/schemas/TestCaseSummary' }
        assignee:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        latestRun:
          allOf:
            - $ref: '#/components/schemas/TestRunSummary'
          nullable: true

    TestRunSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/TestRunStatus' }
        result:
          allOf:
            - $ref: '#/components/schemas/ExecutionResult'
          nullable: true
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, format: int64 }

    AddPlanItemsRequest:
      type: object
      required: [testCaseIds]
      properties:
        testCaseIds:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }
        assigneeUserId:
          type: integer
          format: int64
          nullable: true
          description: PO만 지정. Member가 전송 시 400 `PLAN_ASSIGNEE_FORBIDDEN`.

    AssignPlanItemRequest:
      type: object
      properties:
        assigneeUserId:
          type: integer
          format: int64
          nullable: true
          description: null=미할당으로 되돌리기

    # ----------------------------------------------------------------
    # F-RUN
    # ----------------------------------------------------------------
    TestRunResponse:
      type: object
      required: [id, status, startedAt, durationMs]
      properties:
        id: { type: integer, format: int64 }
        planItem:
          type: object
          properties:
            id: { type: integer, format: int64 }
            testCase: { $ref: '#/components/schemas/TestCaseSummary' }
        status: { $ref: '#/components/schemas/TestRunStatus' }
        result:
          allOf:
            - $ref: '#/components/schemas/ExecutionResult'
          nullable: true
          description: IN_PROGRESS면 null
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        durationMs:
          type: integer
          format: int64
          description: 누적 ms (TC 변경 UNTESTED 시에도 보존, Rule 2)
        environment: { type: string, nullable: true }
        createdBy: { $ref: '#/components/schemas/UserSummary' }
        attachmentCount: { type: integer }
        defectCount: { type: integer }

    TestRunDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TestRunResponse'
        - type: object
          properties:
            steps:
              type: array
              items: { $ref: '#/components/schemas/TestRunStepResponse' }

    TestRunStepResponse:
      type: object
      required: [id, order, action, result]
      properties:
        id: { type: integer, format: int64 }
        testStepId: { type: integer, format: int64, nullable: true }
        order: { type: integer }
        action: { type: string, description: 스냅샷 시점 또는 변경 직전 }
        expectedResult: { type: string, nullable: true }
        result: { $ref: '#/components/schemas/ExecutionResult' }
        actualResult: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true

    StartTestRunRequest:
      type: object
      required: [planItemId]
      properties:
        planItemId: { type: integer, format: int64 }
        environment: { type: string, maxLength: 200, nullable: true }

    UpdateTestRunRequest:
      type: object
      properties:
        environment: { type: string, maxLength: 200, nullable: true }

    ExecuteTestRunStepRequest:
      type: object
      required: [result]
      properties:
        result: { $ref: '#/components/schemas/ExecutionResult' }
        actualResult: { type: string, maxLength: 5000, nullable: true }

    TestRunStepHistoryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        stepId: { type: integer, format: int64, nullable: true }
        stepOrder: { type: integer }
        snapshotAction: { type: string, nullable: true }
        snapshotExpectedResult: { type: string, nullable: true }
        previousResult:
          allOf:
            - $ref: '#/components/schemas/ExecutionResult'
          nullable: true
        changedAt: { type: string, format: date-time }
        changedBy:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        reason: { $ref: '#/components/schemas/TestRunStepHistoryReason' }

    # ----------------------------------------------------------------
    # F-DEF
    # ----------------------------------------------------------------
    DefectListItemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 'DEF-<projCode>-<seq>' }
        title: { type: string }
        status: { $ref: '#/components/schemas/DefectStatus' }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { $ref: '#/components/schemas/Priority' }
        assigneeName: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    DefectResponse:
      type: object
      required: [id, code, title, status, severity, priority]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        reproductionSteps: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DefectStatus' }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { $ref: '#/components/schemas/Priority' }
        reporter: { $ref: '#/components/schemas/UserSummary' }
        assignee:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        testRun:
          allOf:
            - $ref: '#/components/schemas/TestRunSummary'
          nullable: true
        attachmentCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDefectRequest:
      type: object
      required: [title]
      properties:
        testRunId:
          type: integer
          format: int64
          nullable: true
          description: 같은 Project Run만
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000, nullable: true }
        severity:
          allOf:
            - $ref: '#/components/schemas/Severity'
          default: Major
        priority:
          allOf:
            - $ref: '#/components/schemas/Priority'
          default: Medium
        reproductionSteps: { type: string, maxLength: 5000, nullable: true }
        assigneeUserId:
          type: integer
          format: int64
          nullable: true
          description: PO만 지정 가능. Member 전송 시 400.

    UpdateDefectRequest:
      type: object
      description: 부분 변경. 담당자 변경은 별도 /assign.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000, nullable: true }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { $ref: '#/components/schemas/Priority' }
        reproductionSteps: { type: string, maxLength: 5000, nullable: true }

    TransitionDefectStatusRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus: { $ref: '#/components/schemas/DefectStatus' }

    AssignDefectRequest:
      type: object
      properties:
        assigneeUserId:
          type: integer
          format: int64
          nullable: true
          description: null=미할당. 같은 Project 멤버여야 함.

    # ----------------------------------------------------------------
    # F-ATTACH
    # ----------------------------------------------------------------
    AttachmentResponse:
      type: object
      required: [id, fileName, mimeType, sizeBytes, ownerType, ownerId]
      properties:
        id: { type: integer, format: int64 }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        ownerType: { $ref: '#/components/schemas/AttachmentOwnerType' }
        ownerId: { type: integer, format: int64 }
        uploadedBy: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }

    UploadAttachmentRequest:
      type: object
      required: [file, ownerType, ownerId]
      properties:
        file:
          type: string
          format: binary
          description: '단일 파일, 10MB 이하, 화이트리스트(png/jpg/jpeg/gif/webp/pdf/txt/log)'
        ownerType: { $ref: '#/components/schemas/AttachmentOwnerType' }
        ownerId: { type: integer, format: int64 }

    # ----------------------------------------------------------------
    # F-REPORT
    # ----------------------------------------------------------------
    ProjectReportResponse:
      type: object
      properties:
        plans:
          type: array
          items: { $ref: '#/components/schemas/ProjectReportPlanItem' }
        defectStatusCount:
          type: object
          description: 활성(is_deleted=false) 결함만 집계
          properties:
            OPEN: { type: integer }
            IN_PROGRESS: { type: integer }
            RESOLVED: { type: integer }
            CLOSED: { type: integer }
        totals:
          type: object
          properties:
            planCount: { type: integer }
            totalItems: { type: integer }
            totalExecuted: { type: integer }
            overallPassRate:
              type: number
              format: double
              nullable: true

    ProjectReportPlanItem:
      type: object
      properties:
        planId: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: '#/components/schemas/TestPlanStatus' }
        itemCount: { type: integer }
        executedCount:
          type: integer
          description: 최신 Run이 COMPLETED + result != null인 PlanItem 수 (IN_PROGRESS는 미실행)
        passCount: { type: integer }
        failCount: { type: integer }
        blockedCount: { type: integer }
        skippedCount: { type: integer }
        passRate:
          type: number
          format: double
          nullable: true
          description: passCount/executedCount, 0 분모 시 null

# ============================================================================
# 전역 보안 적용 (대부분 엔드포인트는 인증 필수. 공개 엔드포인트는 path에서 `security: []`로 오버라이드)
# ============================================================================
security:
  - bearerAuth: []

# ============================================================================
# 검증 체크리스트 (P1, .claude/pm/CLAUDE.md §P1·산출물 §8)
# ============================================================================
# [1] feature 12개 모두 엔드포인트 커버 — feature ID × operation 매핑
#   F-COMPANY (8):  listCompaniesForMaster, createCompanyByMaster, getCompanyForMaster,
#                   activateCompany, deactivateCompany, getMyCompany, updateCompany,
#                   transferCompanyOwnership, grantCompanyOwnerRole
#   F-WS (10):      listWorkspaces, createWorkspace, getWorkspace, updateWorkspace,
#                   activateWorkspace, deactivateWorkspace, transferWorkspaceOwnership,
#                   listWorkspaceMembers, inviteWorkspaceMembers, removeWorkspaceMember
#   F-AUTH (9):     login, refreshToken, logout, signupCompanyOwner, verifyEmail,
#                   acceptInvite, forgotPassword, resetPassword, changePassword
#   F-USER (15):    listCompanyUsers, getCompanyUser, syncUserRoles, grantUserRoles,
#                   revokeUserRoles, resetUserPasswordByCompanyOwner, activateUser,
#                   deactivateUser, withdrawUser, listInvitations, createInvitation,
#                   cancelInvitation, resendInvitation, getMyProfile, updateMyProfile
#   F-PROJ (9):     listProjects, createProject, getProject, updateProject,
#                   activateProject, deactivateProject, listProjectMembers,
#                   inviteProjectMembers, removeProjectMember
#   F-TS (5):       getTestSuiteTree, createTestSuite, updateTestSuite,
#                   moveTestSuite, deleteTestSuite
#   F-TC (12):      listGlobalTestCases, createGlobalTestCase, updateGlobalTestCase,
#                   deleteGlobalTestCase, listWorkspaceTestCases, createWorkspaceTestCase,
#                   updateWorkspaceTestCase, deleteWorkspaceTestCase, listTestCases,
#                   createProjectTestCase, getTestCase, updateProjectTestCase,
#                   deleteProjectTestCase, moveTestCase
#   F-PLAN (9):     listTestPlans, createTestPlan, getTestPlan, updateTestPlan,
#                   deleteTestPlan, transitionTestPlanStatus, addPlanItems,
#                   assignPlanItem, removePlanItem
#   F-RUN (8):      startTestRun, getTestRun, updateTestRunMeta, deleteTestRun,
#                   getTestRunStepHistory, executeTestRunStep, listTestRunsByPlanItem
#   F-DEF (7):      listDefects, createDefect, getDefect, updateDefect,
#                   deleteDefect, transitionDefectStatus, assignDefect
#   F-ATTACH (4):   listAttachments, uploadAttachment, downloadAttachment,
#                   deleteAttachment
#   F-REPORT (1):   getProjectReport
#   12/12 도메인 커버 ✅
#
# [2] 모든 operation에 tags · operationId · security 부여 ✅
#     - 공개 엔드포인트(login·refreshToken·signupCompanyOwner·verifyEmail·
#       acceptInvite·forgotPassword·resetPassword)는 `security: []`로 명시적 오픈
#     - 그 외 모든 operation은 전역 `security: [bearerAuth: []]` 상속
#
# [3] 4xx/5xx 응답 명시 ✅
#     - 모든 인증 필요 경로: 401/403/500 기본
#     - 입력 검증 가능 경로: 400/422 (ValidationError)
#     - 리소스 식별 경로: 404
#     - 중복/충돌 경로: 409 (Conflict)
#     - Rate Limit 경로(auth/login·forgot-password·resend): 429
#
# [4] permissions.md 매트릭스와 권한 정합 ✅
#     - 각 operation `description`에 (Required Role) 명시 — 매트릭스 §4 정본 직접 인용
#     - ★15 (WO Project 컨테이너 한정), ★16 (삭제 작성자 한정),
#       ★17 (TC 같은 Scope 멤버 수정), ★18 (Viewer의 Global/WS TC 생성) 반영
#
# [도메인 락 정합 — README v2.3]
# - 3-tier 격리 path: companies(Master 전용)/workspaces/projects 중첩 ✅
# - Role 6단 + (User × Scope) 매트릭스: F-USER syncUserRoles 정본 + RolesByScope 직렬화 ✅
# - 회원가입 2경로: signupCompanyOwner(셀프 B) + acceptInvite(C). Master 등록(A)은 createCompanyByMaster + login ✅
# - 이메일 인증/리셋: verifyEmail / forgotPassword / resetPassword ✅
# - Project code 불변: UpdateProjectRequest에 code 필드 제외 + description에 명시 ✅
# - TestRun 단계별 실행: executeTestRunStep (result + actualResult, duration 자동 갱신, 자동 종료) ✅
# - TestCase Scope 3종: TestCaseScope enum + createGlobalTestCase/createWorkspaceTestCase/createProjectTestCase 분기 ✅
# - TC 변경 영향 Run UNTESTED: updateTestCase description에 비동기 트리거 명시 + getTestRunStepHistory ✅
# - ExecutionResult 5종 (UNTESTED 활성): ExecutionResult enum + 기본값 UNTESTED ✅
# - TestRun status 2종: TestRunStatus enum (IN_PROGRESS/COMPLETED) ✅
# - 삭제 작성자 한정(★16): delete* operation description 명시 (TS/TC/PLAN/RUN/DEF/ATTACH) ✅
#
# [GET/POST 룰 정합 — backend §4.2]
# - 모든 조회: GET ✅
# - 생성/수정/삭제(액션)/도메인 액션: POST ✅
# - PUT/PATCH/DELETE 사용 0건 ✅ (downloadAttachment는 파일 스트림 GET, 조회 의미)
