<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TMS — 비밀번호 찾기 (S-AUTH-FORGOT)</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="_shell/shell.css" />
  <link rel="stylesheet" href="_shell/components/button.css" />
  <link rel="stylesheet" href="_shell/components/text-input.css" />
  <style>
    /* ════════════════════════════════════════════════════════
       S-AUTH-FORGOT — 새 화면 (Shell 미사용)
       Figma node-id=285-9766 (Find-PW 1) 정합
       표현 패턴 락: 새 화면 / 라우트 `/forgot-password`
       탭: 아이디 찾기 (S-AUTH-FIND-USERNAME) | 비밀번호 찾기 (활성)
       제출 결과: 성공·실패(미가입) 모두 동일 모달 (AC-17 존재 은닉)
       이메일 발송 후 사용자는 메일 링크 → /reset-password?token=... → S-AUTH-RESET
       ════════════════════════════════════════════════════════ */
    :root {
      --bg-overlay: rgba(15, 23, 42, 0.5);
      --green-50:  #F0FDF4;
      --green-100: #DCFCE7;
      --green-600: #16A34A;
      --z-modal: 200;
    }

    .auth-main {
      min-height: calc(100vh - var(--header-h));
      display: flex; align-items: flex-start; justify-content: center;
      padding: 80px 24px 48px;
    }
    .auth-card {
      width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .auth-brand {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      text-align: center;
    }
    .auth-brand-mark {
      width: 56px; height: 56px; border-radius: 12px;
      background: transparent; display: grid; place-items: center;
      overflow: hidden;
    }
    .auth-brand-mark svg { width: 36px; height: 36px; color: var(--brand-600); }
    .auth-brand-mark > img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .auth-title {
      font-size: 22px; line-height: 30px; font-weight: 700;
      letter-spacing: -0.2px; color: var(--bunker); margin: 0;
    }
    .auth-subtitle {
      font-size: 13px; line-height: 20px; color: var(--grey-44);
      margin: 0; text-align: center;
    }

    /* Tab switcher */
    .auth-tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--neutral-100);
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }
    .auth-tab {
      appearance: none; background: transparent; border: none;
      padding: 8px 12px; border-radius: 6px;
      font-size: 13.5px; font-weight: 500;
      color: var(--neutral-600); cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 120ms, color 120ms, box-shadow 120ms;
    }
    .auth-tab:hover { color: var(--bunker); }
    .auth-tab[aria-selected="true"] {
      background: #fff; color: var(--bunker); font-weight: 600;
      box-shadow: var(--shadow-xs);
    }

    .auth-form { display: flex; flex-direction: column; gap: 16px; }

    .auth-footer {
      text-align: center;
      font-size: 13px; line-height: 18px; color: var(--grey-44);
    }
    .auth-footer .btn-link { margin-left: 4px; font-size: 13px; }

    /* ─── Result Modal (성공·실패 동일, AC-17 존재 은닉) ─── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: var(--bg-overlay);
      z-index: var(--z-modal);
      display: grid; place-items: center;
      padding: 24px;
      animation: bd-in 150ms ease-out;
    }
    .modal-backdrop[hidden] { display: none; }
    @keyframes bd-in { from { background: rgba(15,23,42,0); } }

    .modal-toast-wrap {
      width: 480px; max-width: 100%;
      display: flex; flex-direction: column; gap: 12px;
    }
    .modal-toast {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 480px; max-width: 100%;
      display: flex; align-items: center; gap: 24px;
      box-shadow: 0 20px 24px -4px rgba(0,0,0,0.08), 0 8px 8px -4px rgba(0,0,0,0.03);
      animation: mo-in 150ms ease-out;
    }
    @keyframes mo-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-icon {
      width: 48px; height: 48px; border-radius: 28px;
      background: var(--green-100);
      border: 8px solid var(--green-50); box-sizing: border-box;
      display: grid; place-items: center; flex-shrink: 0; color: var(--green-600);
    }
    .toast-icon svg { width: 22px; height: 22px; }
    .toast-content { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
    .toast-title {
      font-size: 18px; line-height: 28px; font-weight: 600;
      color: var(--neutral-900); margin: 0;
    }
    .toast-desc {
      font-size: 14px; line-height: 20px; color: var(--neutral-600); margin: 0;
      word-break: break-word;
    }
    .modal-actions-row { display: flex; justify-content: flex-end; }

    .screen-meta {
      position: fixed; bottom: 12px; left: 12px;
      font-size: 11px; line-height: 16px;
      color: var(--neutral-500);
      background: #fff; border: 1px solid var(--porcelain);
      padding: 4px 8px; border-radius: 6px;
      z-index: 300;
    }

    @media (max-width: 480px) {
      .auth-main { padding: 48px 16px; }
      .modal-toast { gap: 16px; padding: 20px; }
      .toast-icon { width: 40px; height: 40px; border-width: 6px; }
    }
  </style>
</head>
<body>
  <div id="pub-shell">
    <header class="pub-header"></header>
  </div>

  <main class="auth-main" aria-labelledby="auth-title">
    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-brand-mark" aria-hidden="true">
          <img src="_shell/logo.png" alt="" />
        </div>
        <h1 class="auth-title" id="auth-title">비밀번호 찾기</h1>
        <p class="auth-subtitle">가입시 등록한 이메일 정보를 입력해 주세요.</p>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="계정 정보 찾기">
        <a class="auth-tab" role="tab" aria-selected="false" href="s-auth-find-username.html">아이디 찾기</a>
        <button class="auth-tab" type="button" role="tab"
                id="tab-find-pw" aria-selected="true" aria-controls="form-find-pw">비밀번호 찾기</button>
      </div>

      <form class="auth-form" id="form-find-pw" role="tabpanel" aria-labelledby="tab-find-pw" novalidate>
        <div class="field">
          <label class="field-label" for="username">아이디</label>
          <input class="field-input"
                 type="text"
                 id="username"
                 name="username"
                 placeholder="아이디를 입력해주세요"
                 autocomplete="username"
                 required
                 aria-describedby="username-error" />
          <p class="field-error" id="username-error" role="alert" hidden></p>
        </div>
        <div class="field">
          <label class="field-label" for="email">이메일</label>
          <input class="field-input"
                 type="email"
                 id="email"
                 name="email"
                 placeholder="이메일을 입력해주세요"
                 autocomplete="email"
                 required
                 aria-describedby="email-error" />
          <p class="field-error" id="email-error" role="alert" hidden></p>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="btn-submit">본인인증</button>
      </form>

      <footer class="auth-footer">
        계정이 없으신가요?
        <a class="btn btn-link" href="s-auth-signup-co.html">가입하기</a>
      </footer>

    </div>
  </main>

  <!-- ════════════════════════════════════════════════════════
       Modal: S-AUTH-FORGOT result (AC-17 존재 은닉)
       Figma node-id=342-13221
       성공·실패 모두 동일 모달 → 확인 → 로그인 이동
       ════════════════════════════════════════════════════════ -->
  <div class="modal-backdrop" id="modal-forgot-result" data-modal="forgot-result" hidden>
    <div class="modal-toast-wrap">
      <div class="modal-toast"
           role="alertdialog"
           aria-modal="true"
           aria-labelledby="modal-forgot-title"
           aria-describedby="modal-forgot-desc">
        <div class="toast-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M8.5 12.5l2.5 2.5 4.5-5"/>
          </svg>
        </div>
        <div class="toast-content">
          <h2 class="toast-title" id="modal-forgot-title">이메일이 전송되었습니다</h2>
          <p class="toast-desc" id="modal-forgot-desc">
            본인인증 메일이 발송되었습니다. 메일의 링크를 통해 새 비밀번호를 설정해 주세요.
          </p>
        </div>
      </div>
      <div class="modal-actions-row">
        <button class="btn btn-tertiary btn-md" type="button" id="btn-forgot-confirm">확인</button>
      </div>
    </div>
  </div>

  <div class="screen-meta">S-AUTH-FORGOT · 새 화면 · `/forgot-password` · node-id=285-9766 · modal node-id=342-13221</div>

  <script src="_shell/shell.js"></script>

  <script>
    /* ════════════════════════════════════════════════════════
       Interaction:
       - CTA 항상 활성 (Figma 정합). 검증은 submit에서.
       - submit → POST /api/v1/auth/forgot-password (가정)
       - 성공·실패(미가입·SMTP 오류) 모두 동일 모달 노출 (AC-17 존재 은닉)
       - Esc / Backdrop / 확인 → 모달 close → /login 이동(가정)
       ════════════════════════════════════════════════════════ */
    (function () {
      const form        = document.getElementById('form-find-pw');
      const usernameEl  = document.getElementById('username');
      const emailEl     = document.getElementById('email');
      const usernameErr = document.getElementById('username-error');
      const emailErr    = document.getElementById('email-error');
      const submitBtn   = document.getElementById('btn-submit');
      const backdrop    = document.getElementById('modal-forgot-result');
      const confirmBtn  = document.getElementById('btn-forgot-confirm');

      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const USERNAME_MIN = 4;

      function setError(inputEl, errEl, msg) {
        inputEl.classList.add('is-error');
        errEl.textContent = msg;
        errEl.hidden = false;
      }
      function clearError(inputEl, errEl) {
        inputEl.classList.remove('is-error');
        errEl.textContent = '';
        errEl.hidden = true;
      }
      function isValid() {
        const u = (usernameEl.value || '').trim();
        const e = (emailEl.value || '').trim();
        return u.length >= USERNAME_MIN && EMAIL_RE.test(e);
      }
      usernameEl.addEventListener('input', function () {
        if (usernameEl.classList.contains('is-error') && usernameEl.value.trim().length >= USERNAME_MIN) {
          clearError(usernameEl, usernameErr);
        }
      });
      emailEl.addEventListener('input', function () {
        if (emailEl.classList.contains('is-error') && EMAIL_RE.test(emailEl.value.trim())) {
          clearError(emailEl, emailErr);
        }
      });

      function openModal() {
        backdrop.hidden = false;
        setTimeout(function () { confirmBtn.focus(); }, 80);
      }
      function closeModal() {
        backdrop.hidden = true;
        usernameEl.focus();
        // 데모: 실제 흐름에서는 location.href = 's-auth-login.html';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const u = (usernameEl.value || '').trim();
        const em = (emailEl.value || '').trim();
        let hasErr = false;
        if (u.length < USERNAME_MIN) { setError(usernameEl, usernameErr, '아이디를 4자 이상 입력해주세요.'); hasErr = true; }
        else clearError(usernameEl, usernameErr);
        if (!EMAIL_RE.test(em)) { setError(emailEl, emailErr, '올바른 이메일 형식이 아닙니다.'); hasErr = true; }
        else clearError(emailEl, emailErr);
        if (hasErr) { (usernameEl.classList.contains('is-error') ? usernameEl : emailEl).focus(); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = '전송 중…';
        setTimeout(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = '본인인증';
          openModal();
        }, 500);
      });

      confirmBtn.addEventListener('click', closeModal);
      backdrop.addEventListener('mousedown', function (e) {
        if (e.target === backdrop) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !backdrop.hidden) { e.preventDefault(); closeModal(); }
      });
      backdrop.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        e.preventDefault();
        confirmBtn.focus();
      });
    })();
  </script>
</body>
</html>
