  # ===== Codes (metadata-service 정본) =====
  /codes/{group}:
    get:
      tags: [Codes]
      summary: 코드 그룹 조회 (정본 docs/integration/codes.md)
      operationId: getCodes
      parameters:
        - in: path
          name: group
          required: true
          schema:
            type: string
            enum: [execution_result, defect_status, defect_severity, priority, invite_status]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Code" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: TMS_SESSION

  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      in: query
      name: size
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    Sort:
      in: query
      name: sort
      schema: { type: string }
      description: "예: createdAt,desc"
    PathId:
      in: path
      name: id
      required: true
      schema: { type: string }
    PathUserId:
      in: path
      name: userId
      required: true
      schema: { type: string }
    PathCode:
      in: path
      name: code
      required: true
      schema: { type: string }
      description: Project code (Company unique, 불변)

  responses:
    Empty:
      description: 성공 (data null)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseEmpty" }
    BadRequest:
      description: 400 — COMMON_INVALID_INPUT 등
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Unauthorized:
      description: 401 — AUTH_UNAUTHORIZED, AUTH_TOKEN_EXPIRED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Forbidden:
      description: 403 — AUTH_FORBIDDEN, COMPANY_INACTIVE, TESTCASE_DELETE_NOT_AUTHOR
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    NotFound:
      description: 404 — *_NOT_FOUND
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Conflict:
      description: 409 — *_DUPLICATE, *_INVALID_STATUS_TRANSITION, *_ALREADY_COMPLETED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Gone:
      description: 410 — *_TOKEN_EXPIRED (invite·verify·reset)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  schemas:
    # ---- 공용 ----
    ApiResponseBase:
      type: object
      required: [success, code]
      properties:
        success: { type: boolean }
        code: { type: string, description: "성공 시 'OK', 에러 시 ErrorCode" }
        message: { type: string, nullable: true }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }
    ApiResponseEmpty:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - properties:
            data: { type: object, nullable: true }
    ApiErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - properties:
            success: { type: boolean, enum: [false] }
            data: { type: object, nullable: true }
            errors:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string, description: "ErrorCode 또는 i18n 키" }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    # ---- 도메인 ----
    AuthSession:
      type: object
      properties:
        userId: { type: string }
        companyId: { type: string }
        roles:
          type: array
          items: { type: string }
        passwordChangeRequired: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    SignupSelfRequest:
      type: object
      required: [email, password, companyName, name]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        companyName: { type: string }
        name: { type: string }

    InviteAcceptRequest:
      type: object
      required: [token, password, name]
      properties:
        token: { type: string }
        password: { type: string }
        name: { type: string }

    Company:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CompanyCreateRequest:
      type: object
      required: [name, coEmail, coName]
      properties:
        name: { type: string }
        coEmail: { type: string, format: email }
        coName: { type: string }
    CompanyUpdateRequest:
      type: object
      properties:
        name: { type: string }
    PaginatedCompanyList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Company" }
        page: { $ref: "#/components/schemas/PageMeta" }

    Workspace:
      type: object
      properties:
        id: { type: string }
        companyId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        active: { type: boolean }
        ownerId: { type: string }
    WorkspaceCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    WorkspaceUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    PaginatedWorkspaceList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        page: { $ref: "#/components/schemas/PageMeta" }

    UserDetail:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        companyId: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
        active: { type: boolean }
    RoleAssignment:
      type: object
      properties:
        role: { type: string, enum: [MASTER, CO, WO, PO, MEMBER, VIEWER] }
        scopeType: { type: string, enum: [SYSTEM, COMPANY, WORKSPACE, PROJECT] }
        scopeId: { type: string, nullable: true }
    PaginatedUserList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserDetail" }
        page: { $ref: "#/components/schemas/PageMeta" }
    InviteUserRequest:
      type: object
      required: [email, role, scopeType]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [CO, WO, PO, MEMBER, VIEWER] }
        scopeType: { type: string, enum: [COMPANY, WORKSPACE, PROJECT] }
        scopeId: { type: string, nullable: true }
    InviteMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { type: string, enum: [WO, PO, MEMBER, VIEWER] }
    RoleSyncRequest:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
    MemberList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserDetail" }

    Project:
      type: object
      properties:
        id: { type: string }
        code: { type: string, description: "Company unique, 불변" }
        workspaceId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        active: { type: boolean }
    ProjectCreateRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code: { type: string }
        description: { type: string }
    ProjectUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    PaginatedProjectList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        page: { $ref: "#/components/schemas/PageMeta" }

    Suite:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        parentSuiteId: { type: string, nullable: true }
        name: { type: string }
        position: { type: integer }
    SuiteTree:
      type: array
      items:
        allOf:
          - $ref: "#/components/schemas/Suite"
          - properties:
              children:
                type: array
                items: { $ref: "#/components/schemas/Suite" }
    SuiteCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parentSuiteId: { type: string, nullable: true }

    TestCase:
      type: object
      properties:
        id: { type: string }
        scope: { type: string, enum: [PROJECT, WORKSPACE, GLOBAL] }
        scopeId: { type: string, nullable: true }
        suiteId: { type: string, nullable: true }
        title: { type: string }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW] }
        steps:
          type: array
          items: { $ref: "#/components/schemas/TestStep" }
        tags:
          type: array
          items: { type: string }
        authorId: { type: string }
        createdAt: { type: string, format: date-time }
    TestStep:
      type: object
      properties:
        id: { type: string }
        order: { type: integer }
        action: { type: string }
        expected: { type: string }
    TestCaseCreateRequest:
      type: object
      required: [title, scope]
      properties:
        title: { type: string }
        scope: { type: string, enum: [PROJECT, WORKSPACE, GLOBAL] }
        scopeId: { type: string, nullable: true }
        suiteId: { type: string, nullable: true }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW] }
        steps:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              expected: { type: string }
        tags:
          type: array
          items: { type: string }
    TestCaseUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/TestCaseCreateRequest"
    PaginatedTestCaseList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TestCase" }
        page: { $ref: "#/components/schemas/PageMeta" }

    TestPlan:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        cycleStart: { type: string, format: date }
        cycleEnd: { type: string, format: date }
        testCaseIds:
          type: array
          items: { type: string }
        assignments:
          type: array
          items:
            type: object
            properties:
              testCaseId: { type: string }
              assigneeId: { type: string }
    TestPlanCreateRequest:
      type: object
      required: [name, testCaseIds]
      properties:
        name: { type: string }
        cycleStart: { type: string, format: date }
        cycleEnd: { type: string, format: date }
        testCaseIds:
          type: array
          items: { type: string }
    TestPlanUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/TestPlanCreateRequest"
    PaginatedTestPlanList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TestPlan" }
        page: { $ref: "#/components/schemas/PageMeta" }

    TestRun:
      type: object
      properties:
        id: { type: string }
        testPlanId: { type: string }
        testCaseId: { type: string }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED] }
        executionResult:
          type: string
          enum: [PASS, FAIL, BLOCK, SKIP, UNTESTED, PENDING]
        assigneeId: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        stepResults:
          type: array
          items: { $ref: "#/components/schemas/StepResult" }
    StepResult:
      type: object
      properties:
        stepId: { type: string }
        result: { type: string, enum: [PASS, FAIL, BLOCK, SKIP, UNTESTED] }
        note: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }
    StepResultRequest:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [PASS, FAIL, BLOCK, SKIP, UNTESTED] }
        note: { type: string }
    PaginatedTestRunList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TestRun" }
        page: { $ref: "#/components/schemas/PageMeta" }

    Defect:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        severity: { type: string, enum: [CRITICAL, MAJOR, MINOR, TRIVIAL] }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW] }
        assigneeId: { type: string, nullable: true }
        testRunId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    DefectCreateRequest:
      type: object
      required: [title, severity]
      properties:
        title: { type: string }
        description: { type: string }
