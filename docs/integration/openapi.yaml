openapi: 3.0.3
info:
  title: TMS API
  description: |
    TMS (Test Management System) REST API 정본.
    - 정본 분리: 본 문서 = 인터페이스 계약 / `docs/features/` = 비즈니스 규칙 / `docs/standards/backend-coding-standard.md` = 구현 규약.
    - HTTP 메서드: GET / POST 만 사용 (backend-standard §4.2 락).
    - 응답 래퍼: ApiResponse 단일 구조 (backend-standard §4.5).
    - ErrorCode: `code` 필드는 backend-standard §5.2 enum. i18n 매핑 = `docs/integration/error-code-mapping.md`.
  version: "0.1.0"
  contact:
    name: TMS PM
servers:
  - url: https://api.tms.example.com/api/v1
    description: Production (TBD)
  - url: http://localhost:8080/api/v1
    description: Local dev

tags:
  - name: Auth
    description: F-AUTH — 인증·회원가입 2경로·초대·비번 리셋
  - name: Master
    description: F-COMPANY (Master 전용) — Company 생성·비활성·전역 조회
  - name: Company
    description: F-COMPANY (CO) — 자기 회사 조회·수정·이관·CO 승격
  - name: Workspace
    description: F-WS — WO 생성/CO 비활성/소유자 이관/멤버 초대
  - name: User
    description: F-USER — Company 사용자 관리 + Role 매트릭스
  - name: Project
    description: F-PROJ — 프로젝트 CRUD·멤버
  - name: TestSuite
    description: F-TS — 폴더 트리
  - name: TestCase
    description: F-TC — TC CRUD (Scope 3종)
  - name: TestPlan
    description: F-PLAN — 계획·할당·사이클
  - name: TestRun
    description: F-RUN — 실행 결과 (단계별·자동 종료)
  - name: Defect
    description: F-DEF — 결함 관리
  - name: Attachment
    description: F-ATTACH — 이미지 단일 업로드
  - name: Report
    description: F-REPORT — Pass율·결함 카운트
  - name: Codes
    description: metadata-service codes (정본: docs/integration/codes.md)

paths:
  # ===== Auth =====
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 로그인 성공 (세션 쿠키 발급)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: authLogout
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /auth/signup:
    post:
      tags: [Auth]
      summary: 셀프 가입 (경로 B — CO 신규 회사 자동 생성)
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupSelfRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: 이메일 인증 토큰 검증
      operationId: authVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "410": { $ref: "#/components/responses/Gone" }
  /auth/invite/accept:
    post:
      tags: [Auth]
      summary: 초대 토큰 수락 (경로 C)
      operationId: authAcceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteAcceptRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410": { $ref: "#/components/responses/Gone" }
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 메일 요청
      operationId: authPasswordForgot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 적용
      operationId: authPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "410": { $ref: "#/components/responses/Gone" }
  /auth/password/change-first:
    post:
      tags: [Auth]
      summary: 임시비번 강제 변경 (Master·CO 등록 첫 로그인)
      operationId: authPasswordChangeFirst
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ===== Master · F-COMPANY =====
  /master/companies:
    get:
      tags: [Master]
      summary: Company 목록 (Master)
      operationId: masterListCompanies
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/PaginatedCompanyList" }
    post:
      tags: [Master]
      summary: Company + CO 동시 생성 (Master 등록 경로 A)
      operationId: masterCreateCompany
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyCreateRequest" }
      responses:
        "200":
          description: 생성 성공 (CO 임시비번 메일 발송)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/Company" }
        "409": { $ref: "#/components/responses/Conflict" }
  /master/companies/{id}:
    get:
      tags: [Master]
      operationId: masterGetCompany
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/Company" }
        "404": { $ref: "#/components/responses/NotFound" }
  /master/companies/{id}/deactivate:
    post:
      tags: [Master]
      operationId: masterDeactivateCompany
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "404": { $ref: "#/components/responses/NotFound" }
  /master/companies/{id}/activate:
    post:
      tags: [Master]
      operationId: masterActivateCompany
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/Empty" }

  # ===== Company (CO) =====
  /company:
    get:
      tags: [Company]
      summary: 자기 회사 조회
      operationId: getOwnCompany
      security: [{ session: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/Company" }
  /company/update:
    post:
      tags: [Company]
      summary: 자기 회사 정보 수정 (CO)
      operationId: updateOwnCompany
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /company/transfer-ownership:
    post:
      tags: [Company]
      operationId: transferCompanyOwnership
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /company/users/{userId}/grant-co:
    post:
      tags: [Company]
      operationId: grantCoRole
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathUserId" }]
      responses:
        "200": { $ref: "#/components/responses/Empty" }

  # ===== Workspace · F-WS =====
  /workspaces:
    get:
      tags: [Workspace]
      operationId: listWorkspaces
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/PaginatedWorkspaceList" }
    post:
      tags: [Workspace]
      summary: Workspace 생성 (WO)
      operationId: createWorkspace
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCreateRequest" }
      responses:
        "200":
          description: 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/Workspace" }
  /workspaces/{id}:
    get:
      tags: [Workspace]
      operationId: getWorkspace
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/NotFound" }
  /workspaces/{id}/update:
    post:
      tags: [Workspace]
      operationId: updateWorkspace
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /workspaces/{id}/deactivate:
    post:
      tags: [Workspace]
      operationId: deactivateWorkspace
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /workspaces/{id}/activate:
    post:
      tags: [Workspace]
      operationId: activateWorkspace
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /workspaces/{id}/transfer:
    post:
      tags: [Workspace]
      operationId: transferWorkspace
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetWorkspaceOwnerId]
              properties:
                targetWorkspaceOwnerId: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /workspaces/{id}/members:
    get:
      tags: [Workspace]
      operationId: listWorkspaceMembers
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/MemberList" }
  /workspaces/{id}/members/invite:
    post:
      tags: [Workspace]
      operationId: inviteWorkspaceMember
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteMemberRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /workspaces/{id}/members/{userId}/remove:
    post:
      tags: [Workspace]
      operationId: removeWorkspaceMember
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/PathUserId"
      responses:
        "200": { $ref: "#/components/responses/Empty" }

  # ===== User · F-USER =====
  /users:
    get:
      tags: [User]
      summary: Company 사용자 목록
      operationId: listUsers
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - in: query
          name: q
          schema: { type: string }
          description: 검색 (이름·이메일)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/PaginatedUserList" }
  /users/{userId}:
    get:
      tags: [User]
      operationId: getUser
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathUserId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/UserDetail" }
  /users/invite:
    post:
      tags: [User]
      summary: 일반 사용자 초대 (CO, 경로 C)
      operationId: inviteUser
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /users/{userId}/deactivate:
    post:
      tags: [User]
      operationId: deactivateUser
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathUserId" }]
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /users/{userId}/password-reset:
    post:
      tags: [User]
      summary: 사용자 비밀번호 재설정 메일 발송 (CO)
      operationId: triggerUserPasswordReset
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathUserId" }]
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /users/{userId}/roles/sync:
    post:
      tags: [User]
      summary: 사용자 Role 매트릭스 일괄 동기화 (단일 트랜잭션, ★15)
      operationId: syncUserRoles
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathUserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleSyncRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ===== Project · F-PROJ =====
  /workspaces/{workspaceId}/projects:
    get:
      tags: [Project]
      operationId: listProjects
      security: [{ session: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/PaginatedProjectList" }
    post:
      tags: [Project]
      summary: Project 생성 (WO/PO/Member, code 자동 제안)
      operationId: createProject
      security: [{ session: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreateRequest" }
      responses:
        "200":
          description: 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/Project" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{code}:
    get:
      tags: [Project]
      operationId: getProjectByCode
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathCode" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/Project" }
  /projects/{code}/update:
    post:
      tags: [Project]
      operationId: updateProject
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /projects/{code}/deactivate:
    post:
      tags: [Project]
      operationId: deactivateProject
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathCode" }]
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /projects/{code}/members:
    get:
      tags: [Project]
      operationId: listProjectMembers
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathCode" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/MemberList" }
  /projects/{code}/members/invite:
    post:
      tags: [Project]
      operationId: inviteProjectMember
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteMemberRequest" }
      responses:
        "200": { $ref: "#/components/responses/Empty" }

  # ===== TestSuite · F-TS =====
  /projects/{code}/suites:
    get:
      tags: [TestSuite]
      operationId: listSuites
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathCode" }]
      responses:
        "200":
          description: 트리 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/SuiteTree" }
    post:
      tags: [TestSuite]
      operationId: createSuite
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/PathCode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuiteCreateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - properties:
                      data: { $ref: "#/components/schemas/Suite" }
  /projects/{code}/suites/{suiteId}/rename:
    post:
      tags: [TestSuite]
      operationId: renameSuite
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/PathCode"
        - in: path
          name: suiteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
  /projects/{code}/suites/{suiteId}/move:
    post:
      tags: [TestSuite]
      operationId: moveSuite
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/PathCode"
        - in: path
          name: suiteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentSuiteId: { type: string, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{code}/suites/{suiteId}/delete:
    post:
      tags: [TestSuite]
      summary: Suite 삭제 (작성자 한정, ★16 Rule 1)
      operationId: deleteSuite
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/PathCode"
        - in: path
          name: suiteId
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Empty" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ===== TestCase · F-TC =====
  /test-cases:
    get:
      tags: [TestCase]
      summary: TC 목록 (Scope 3종 합본 — Rule 3)
      operationId: listTestCases
      security: [{ session: [] }]
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [PROJECT, WORKSPACE, GLOBAL, ALL] }
        - in: query
          name: projectCode
          schema: { type: string }
        - in: query
          name: workspaceId
          schema: { type: string }
