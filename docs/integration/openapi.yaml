      operationId: uploadAttachment
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, ownerType, ownerId]
              properties:
                file:
                  type: string
                  format: binary
                ownerType:
                  type: string
                  enum: [DEFECT, TEST_RUN, TEST_CASE]
                ownerId:
